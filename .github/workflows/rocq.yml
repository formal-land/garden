name: Rocq

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: rocq-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Download Git submodules
      run: git submodule update --init --recursive
    - uses: coq-community/docker-coq-action@v1
      with:
        custom_image: ghcr.io/formal-land/garden-rocq-ci:rocq-9.0.1
        custom_script: |
          startGroup "Install dependencies"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            cargo --version
            sudo ln -s `which python3` /usr/bin/python
            opam install -y --deps-only Garden/rocq-garden.opam
          endGroup
          startGroup "Set the rights"
            sudo chown -R $(whoami) .
          endGroup
          startGroup "Install Circom"
            cd third-party/circom
            cargo install --path circom
            cd ../..
          endGroup
          startGroup "Translate Circom library"
            cd third-party/circomlib
            # Translate each Circom circuit to JSON
            find . -name '*.circom' -execdir circom {} \;
            cd ../..
            # Translate the JSON to Rocq
            python scripts/rocq_of_circom_ci.py
          endGroup
          startGroup "Compile the Rocq project"
            cd Garden
            # The default build includes the complete generated certificate
            # replay; the generation check and the independent all-44-point
            # oracle stay as diagnostics.  One worker per runner vCPU;
            # measured per-worker peaks fit inside the runner's memory.
            make -j"$(nproc)"
            make orchard-vk-provenance-generated-check
            make orchard-vk-provenance-oracle-check
            make snapshot
            # The configure metadata prelude is a formal model of Halo 2
            # builder operations.  Keep its counts, selector kinds, exact
            # query order, permutation columns, constants and minimum degree
            # in parity with the implementation snapshots.
            make orchard-configure-json-compare
            make orchard-structure-json-from-model
            cd ..
          endGroup
          startGroup "Check that the diff is empty (excluding submodules)"
            git -c color.ui=always diff --exit-code --ignore-submodules=dirty
          endGroup
    - name: Upload generated Orchard structure
      uses: actions/upload-artifact@v4
      with:
        name: orchard-circuit-structure
        path: Garden/Orchard/Snapshots/circuit_structure_generated_from_model.json
        if-no-files-found: error
        retention-days: 1

  website:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/orchard-verification

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Download generated Orchard structure
      uses: actions/download-artifact@v4
      with:
        name: orchard-circuit-structure
        path: Garden/Orchard/Snapshots
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/orchard-verification/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Build static bundle and generate circuit data
      run: npm run build
    - name: Validate generated circuit data
      working-directory: .
      run: |
        python3 -m unittest scripts.tests.test_generate_orchard_circuit_explorer
        python3 scripts/generate_orchard_circuit_explorer.py --check
        python3 scripts/generate_orchard_circuit_explorer.py --validate web/orchard-verification/public/data/orchard-circuit-highlevel.v1.json
        python3 -m unittest scripts.tests.test_generate_orchard_circuit_grid
        python3 scripts/generate_orchard_circuit_grid.py --check
    - name: Type-check and run component tests
      run: npm run check
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run browser tests
      run: npm run test:e2e
      env:
        ORCHARD_E2E_ORIGIN: http://127.0.0.1:4173/orchard/
    - name: Check that validation left tracked files unchanged
      working-directory: .
      run: git diff --exit-code
