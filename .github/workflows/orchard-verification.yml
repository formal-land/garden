name: Orchard Verification Visualization

on:
  push:
    branches: [ "main" ]
    paths:
      - "web/orchard-verification/**"
      - "docs/orchard-verification/**"
      - "Garden/Halo2/high_level_trace*.v"
      - "Garden/Orchard/Snapshots/circuit_structure_generated_from_model.json"
      - "scripts/generate_orchard_circuit_explorer.py"
      - "scripts/orchard_circuit_explorer.schema.json"
      - "scripts/orchard_circuit_explorer_manifest.v1.json"
      - "scripts/tests/test_generate_orchard_circuit_explorer.py"
      - "docs/BUILD.md"
      - "README.md"
      - "AGENT.md"
      - ".github/workflows/orchard-verification.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "web/orchard-verification/**"
      - "docs/orchard-verification/**"
      - "Garden/Halo2/high_level_trace*.v"
      - "Garden/Orchard/Snapshots/circuit_structure_generated_from_model.json"
      - "scripts/generate_orchard_circuit_explorer.py"
      - "scripts/orchard_circuit_explorer.schema.json"
      - "scripts/orchard_circuit_explorer_manifest.v1.json"
      - "scripts/tests/test_generate_orchard_circuit_explorer.py"
      - "docs/BUILD.md"
      - "README.md"
      - "AGENT.md"
      - ".github/workflows/orchard-verification.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/orchard-verification

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/orchard-verification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate generated circuit data
        working-directory: .
        run: |
          python3 -m unittest scripts.tests.test_generate_orchard_circuit_explorer
          python3 scripts/generate_orchard_circuit_explorer.py --validate web/orchard-verification/public/data/orchard-circuit-highlevel.v1.json

      - name: Type-check and run component tests
        run: npm run check

      - name: Build committed static bundle
        run: npm run build

      - name: Check generated bundle is current
        working-directory: .
        run: git diff --exit-code -- docs/orchard-verification

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
