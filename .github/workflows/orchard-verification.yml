name: Orchard Verification Visualization

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "web/orchard-verification/**"
      - "garden.svg"
      - "Garden/Halo2/high_level_trace*.v"
      - "Garden/Makefile"
      - "Garden/Orchard/Snapshots/circuit_configure_generated_from_*.json"
      - "Garden/Orchard/Snapshots/circuit_synthesis_generated_from_*.json"
      - "Garden/Orchard/Snapshots/circuit_structure_generated_from_model.json"
      - "scripts/generate_orchard_circuit_grid.py"
      - "scripts/generate_orchard_circuit_explorer.py"
      - "scripts/orchard_circuit_grid.schema.json"
      - "scripts/orchard_circuit_explorer.schema.json"
      - "scripts/orchard_circuit_explorer_manifest.v1.json"
      - "scripts/tests/test_generate_orchard_circuit_grid.py"
      - "scripts/tests/test_generate_orchard_circuit_explorer.py"
      - "docs/BUILD.md"
      - "README.md"
      - "AGENT.md"
      - ".github/workflows/orchard-verification.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "web/orchard-verification/**"
      - "garden.svg"
      - "Garden/Halo2/high_level_trace*.v"
      - "Garden/Makefile"
      - "Garden/Orchard/Snapshots/circuit_configure_generated_from_*.json"
      - "Garden/Orchard/Snapshots/circuit_synthesis_generated_from_*.json"
      - "Garden/Orchard/Snapshots/circuit_structure_generated_from_model.json"
      - "scripts/generate_orchard_circuit_grid.py"
      - "scripts/generate_orchard_circuit_explorer.py"
      - "scripts/orchard_circuit_grid.schema.json"
      - "scripts/orchard_circuit_explorer.schema.json"
      - "scripts/orchard_circuit_explorer_manifest.v1.json"
      - "scripts/tests/test_generate_orchard_circuit_grid.py"
      - "scripts/tests/test_generate_orchard_circuit_explorer.py"
      - "docs/BUILD.md"
      - "README.md"
      - "AGENT.md"
      - ".github/workflows/orchard-verification.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/orchard-verification

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/orchard-verification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle and generate circuit data
        run: npm run build

      - name: Validate generated circuit data
        working-directory: .
        run: |
          python3 -m unittest scripts.tests.test_generate_orchard_circuit_explorer
          python3 scripts/generate_orchard_circuit_explorer.py --check
          python3 scripts/generate_orchard_circuit_explorer.py --validate web/orchard-verification/public/data/orchard-circuit-highlevel.v1.json
          python3 -m unittest scripts.tests.test_generate_orchard_circuit_grid
          python3 scripts/generate_orchard_circuit_grid.py --check

      - name: Type-check and run component tests
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Check that validation left tracked files unchanged
        working-directory: .
        run: git diff --exit-code

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/orchard-verification/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
