name: Rocq dependency image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rocq-image.yml"
      - "Garden/rocq-ci.Dockerfile"
      - "Garden/rocq-ci.Dockerfile.dockerignore"
      - "Garden/rocq-garden.opam"

permissions:
  contents: read
  packages: write

concurrency:
  group: rocq-dependency-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: formal-land/garden-rocq-ci

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and publish Rocq dependency image
      uses: docker/build-push-action@v7
      with:
        context: Garden
        file: Garden/rocq-ci.Dockerfile
        platforms: linux/amd64
        pull: true
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocq-9.0.1
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=garden-rocq-ci
        cache-to: type=gha,mode=max,scope=garden-rocq-ci
